services:
  - type: web
    name: dealmind-intentlock-app
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install --include=dev && npm --prefix server install --include=dev && npm run build:all
    startCommand: node --experimental-sqlite server/dist/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.13.0
      - key: DATABASE_PATH
        value: data/dealmind.sqlite
      - key: APPROVAL_VALIDITY_SECONDS
        value: "900"
      - key: PAYPAL_ENV
        value: sandbox
      - key: PAYPAL_BASE_URL
        value: https://api-m.sandbox.paypal.com
      - key: LLM_PROVIDER
        value: mock
      - key: LLM_MODEL
        value: mock-model-v1
      - key: TOKEN_HMAC_SECRET
        value: e8f9b2a1c4d3e5f7a0b2c4d6e8f0a2b4c6d8e0f2a4b6c8d0e2f4a6b8c0d2e4f6
      - key: PAYPAL_CLIENT_ID
        value: BAAmUIptx_DbDF2S_IWAYBO9uHr-ciYXT9NGFbHxNchXwtfoSzJgUkXW-lGg31JOj2lSrFRRhe6M3OSqVg
      - key: PAYPAL_CLIENT_SECRET
        value: EP4PcmLLVbBL5KswxAmeZTiz0rCKFRPS_SvrIhqesslAvH7TQvoMz50ewwkSO6627IaG18UI0uIh5tWC
      - key: PAYPAL_RETURN_URL
