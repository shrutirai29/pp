services:
  - type: web
    name: dealmind-intentlock
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm --prefix server install && npm run build:all
    startCommand: node --experimental-sqlite server/dist/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: data/dealmind.sqlite
      - key: APPROVAL_VALIDITY_SECONDS
        value: "900"
      - key: PAYPAL_ENV
        value: sandbox
      - key: PAYPAL_BASE_URL
        value: https://api-m.sandbox.paypal.com
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: TOKEN_HMAC_SECRET
        generateValue: true
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: PAYPAL_RETURN_URL
        sync: false
      - key: PAYPAL_CANCEL_URL
        sync: false
